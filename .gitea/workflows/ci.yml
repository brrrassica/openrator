# Self-hosted mirror of .github/workflows/ci.yml (same three checks).
# Action majors stay on v4 here — the LAN act_runner image is validated on v4;
# the GitHub copy runs v7+ (Node 24) as required by GitHub-hosted runners.
name: ci

on:
  push:
    branches: ['main', 'm*', 'dev*']
  pull_request:

jobs:
  mobile-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install
        working-directory: apps/mobile
        run: |
          for i in 1 2 3; do
            npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=30000 && break
            echo "npm ci attempt $i failed, retrying..."
            sleep 10
          done

      - name: Unit tests
        working-directory: apps/mobile
        run: npx vitest run

      - name: Typecheck
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Android bundle (expo export)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir dist-ci