# fdroiddata metadata for OpenRator (tech.alatcerdas.openrator)

Draft for the F-Droid main repository. Copy to `metadata/tech.alatcerdas.openrator.yml`
in a fork of https://gitlab.com/fdroid/fdroiddata and open a merge request.

Modeled on `templates/build-react-native.yml` + the docs in
`docs/05-fdroid-submission.md`. Validate with `fdroid build --test`
before submitting; the build recipe will likely need iteration with a
maintainer (Expo/RN builds are fiddly).

```yaml
Categories:
  - AI Chat
License: MIT
AuthorName: Sam Ralial
AuthorEmail: sam@alatcerdas.tech
AuthorWebSite: https://alatcerdas.tech
WebSite: https://github.com/brrrassica/openrator
SourceCode: https://github.com/brrrassica/openrator
IssueTracker: https://github.com/brrrassica/openrator/issues
Changelog: https://github.com/brrrassica/openrator/blob/main/docs/CHANGELOG.md

AutoName: OpenRator
Name: OpenRator

Description: |
  OpenRator is a single-pane dashboard for your OpenRouter account, built for
  Android with Expo / React Native. It keeps your API keys on-device and talks
  to OpenRouter directly — no backend, bring your own key.

  - Home: credits at a glance, 14-day spend trend, provider health strip,
    pull-to-refresh
  - Spend & Endpoint analytics: 30-day usage chart with provider and endpoint
    breakdowns
  - Provider Policy editor: catalog browsing, routing presets with optimistic
    writes
  - Keys: management-key CRUD, create and reveal flows, clear-on-sign-out
  - Privacy: everything stored on-device (SQLite, SecureStore), no trackers,
    no ads, no accounts

  OpenRator is an independent tool and is not affiliated with or endorsed by
  OpenRouter.

RepoType: git
Repo: https://github.com/brrrassica/openrator

Builds:
  - versionName: '0.1.1'
    versionCode: 2
    # points at tag v0.1.1 (the first F-Droid build); bump with each release
    commit: da462ed8c4727d68d56b389bd6cbb94737cecb1a
    subdir: apps/mobile
    init:
      - npm ci
    build: |
      npx expo prebuild --platform android --clean --no-install
      cd android
      ./gradlew assembleRelease
    output: android/app/build/outputs/apk/release/app-release.apk
    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: apps/mobile/app.json|"versionCode":\s*(\d+)|.|"version":\s*"([0-9.]+)"
CurrentVersion: '0.1.1'
CurrentVersionCode: 2

MaintainerNotes: |
  Expo SDK 57 / React Native 0.86 managed workflow; android/ is generated by
  `expo prebuild` and is NOT committed (gitignored), so every build must run
  prebuild first. npm (current Node) is allowed per inclusion policy.

  First F-Droid build must be v0.1.1 (versionCode 2): the v0.1.0 APK was built
  with the old app id ai.openrator.app, so it cannot be used. Tag v0.1.1 after
  this prep commit ships, then fill in the commit hash above.

  If the build environment JDK defaults bite (RN 0.86 needs a recent JDK), apply
  the jvmToolchain 17->21 seds from templates/build-react-native.yml to
  node_modules/@react-native/gradle-plugin. expo-updates is declared but
  updates.enabled=false; removing it is optional (less build surface).
```
