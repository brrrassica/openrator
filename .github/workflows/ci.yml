# GitHub Actions mirror of .gitea/workflows/ci.yml (same three checks).
# Action majors are ahead of the Gitea copy on purpose: GitHub runners need v7+
# (Node 24) while the self-hosted act_runner is proven on v4.
name: ci

on:
  push:
    branches: ['main', 'm*', 'dev*']
  pull_request:

jobs:
  mobile-checks:
    runs-on: [self-hosted, opencode-sam]
    # The runner's ~/.npm cache is persistent and shared by every runner
    # instance, so npm restores tarballs from the local disk instead of
    # re-downloading them. setup-node's `cache: npm` would instead push this to
    # the GitHub cache service and pull it back over the network every run.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        working-directory: apps/mobile
        run: npx vitest run

      - name: Typecheck
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Android bundle (expo export)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir dist-ci

      - name: Upload Android bundle
        uses: actions/upload-artifact@v7
        with:
          name: android-bundle
          path: apps/mobile/dist-ci
          retention-days: 7